[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyautoclick"
version = "0.3.1"
description = "Hold-to-click and auto-click with global hotkeys, multi-language UI."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Thomas Mayor", email = "thomas.mayor.ge@gmail.com" }]
keywords = ["autoclicker", "auto-click", "tkinter", "pynput", "linux", "desktop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: Utilities",
]
dependencies = [
    "pynput>=1.7,<2",
    "sv-ttk>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9",
    "pytest-cov>=4.1,<6",
    "ruff>=0.4,<1",
    "mypy>=1.8,<2",
]

[project.scripts]
pyautoclick = "pyautoclick.__main__:main"

[project.urls]
Homepage = "https://github.com/ThomasMayor/py-autoclick"
Issues = "https://github.com/ThomasMayor/py-autoclick/issues"

[tool.hatch.build.targets.wheel]
packages = ["pyautoclick"]

[tool.hatch.build.targets.wheel.force-include]
"pyautoclick/i18n/locales/en.json" = "pyautoclick/i18n/locales/en.json"
"pyautoclick/i18n/locales/fr.json" = "pyautoclick/i18n/locales/fr.json"
"pyautoclick/i18n/locales/es.json" = "pyautoclick/i18n/locales/es.json"
"pyautoclick/i18n/locales/pt.json" = "pyautoclick/i18n/locales/pt.json"
"pyautoclick/i18n/locales/de.json" = "pyautoclick/i18n/locales/de.json"
"pyautoclick/i18n/locales/it.json" = "pyautoclick/i18n/locales/it.json"
"pyautoclick/i18n/locales/ru.json" = "pyautoclick/i18n/locales/ru.json"
"pyautoclick/i18n/locales/zh.json" = "pyautoclick/i18n/locales/zh.json"
"pyautoclick/i18n/locales/ja.json" = "pyautoclick/i18n/locales/ja.json"
"pyautoclick/i18n/locales/ar.json" = "pyautoclick/i18n/locales/ar.json"
"pyautoclick/i18n/locales/he.json" = "pyautoclick/i18n/locales/he.json"
"pyautoclick/assets/py-autoclick.png" = "pyautoclick/assets/py-autoclick.png"

[tool.hatch.build.targets.wheel.shared-data]
"pyautoclick/assets/py-autoclick.png" = "share/icons/hicolor/256x256/apps/py-autoclick.png"

# ---- Ruff (lint + format) ----
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["__pycache__", ".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "B",           # flake8-bugbear
    "UP",          # pyupgrade (modernize syntax)
    "SIM",         # flake8-simplify
    "RUF",         # ruff-specific
    "PL",          # pylint
    "TCH",         # flake8-type-checking
]
ignore = [
    "PLR0913",     # too many args (AppContext, BaseTab)
    "PLR2004",     # magic numbers in UI sizes/colors
    "PLR0912",     # too-many-branches in click loops (intentional)
    "E501",        # line length handled by formatter
    "PLC0415",     # lazy imports (sv-ttk fallback, test subprocess helpers)
    "PLW0603",     # global statements (singleton caches: i18n._TABLES, direction._CACHE)
    "SIM105",      # try/except: pass — equivalent to contextlib.suppress, no clarity gain
    "SIM115",      # open() without context manager — lock files kept open for process lifetime
    "TC001",       # type-only first-party imports — moot with `from __future__ import annotations`
    "TC003",       # type-only stdlib imports — idem
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "PLR2004",   # magic numbers in test data
    "S101",      # asserts are the whole point of tests
    "SIM117",    # nested `with patch(...)` reads better than combined
    "RUF001",    # unicode chars in test data (NBSP, RTL marks etc.) are intentional
    "PLW0108",   # `lambda x: f(x)` is sometimes required when f's signature differs
                 # (e.g. callback called with kwarg, list.append takes positional only)
]
"pyautoclick/i18n/locales/*" = ["E501"]  # translation strings

# ---- Mypy ----
# Pragmatic config: strict on the typed business core, lenient on the UI layer
# where tkinter callbacks have inherently weak signatures.
[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
check_untyped_defs = true
exclude = ["build/", "dist/", "tests/"]

[[tool.mypy.overrides]]
module = ["pynput.*", "sv_ttk"]
ignore_missing_imports = true

# UI layer: lenient — tk widgets and event callbacks resist clean typing
[[tool.mypy.overrides]]
module = "pyautoclick.ui.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false
disable_error_code = ["attr-defined", "assignment", "arg-type", "abstract", "union-attr", "no-untyped-call", "misc", "unreachable"]

# Entry point: same lenience (uses Tk private attrs, callback adapters)
[[tool.mypy.overrides]]
module = "pyautoclick.__main__"
disable_error_code = ["attr-defined", "arg-type"]

# Core business code: strict
[[tool.mypy.overrides]]
module = ["pyautoclick.core.*", "pyautoclick.persistence.*", "pyautoclick.i18n.*", "pyautoclick.services.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true

# ---- Pytest ----
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=pyautoclick",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",        # Codecov / GitHub Actions consumption
    "--cov-fail-under=80",     # gate: any drop below 80% fails CI
]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration (deselect with '-m \"not integration\"')",
    "linux_only: marks tests requiring Linux (fcntl, AF_UNIX)",
]

[tool.coverage.run]
source = ["pyautoclick"]
omit = [
    "pyautoclick/__main__.py",  # bootstrap, hard to test
    "pyautoclick/ui/*",         # tk UI requires display
]

[tool.coverage.report]
precision = 1
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
