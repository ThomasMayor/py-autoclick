name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Force every JavaScript action (including transitive ones — e.g.
# actions/github-script that codecov-action depends on internally) to run
# under Node 24. Without this opt-in, deprecation annotations leak from
# any sub-action that hasn't been re-pinned yet. Mandatory after 2026-06-02,
# we set it now to surface incompatibilities early.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Action versions are pinned to majors that ship Node 24 binaries — Node 20
# is being removed from GitHub runners on 2026-09-16. See:
# https://github.blog/changelog/2024-...-actions-deprecating-node20

jobs:
  test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10           # hard cap to prevent runner zombies
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      # Pip cache deserialization is flaky on macOS runners (the resulting
      # warning is raised at failure level by GitHub annotations even when
      # the job itself succeeds). Disable cache on macOS only — Linux and
      # Windows still benefit from it.
      - name: Set up Python (cached)
        if: runner.os != 'macOS'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Python (uncached, macOS)
        if: runner.os == 'macOS'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install xvfb (Linux only — pynput xorg backend needs DISPLAY at import)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run pytest (skip linux_only on non-Linux)
        if: runner.os != 'Linux'
        run: pytest -v -m "not linux_only"

      - name: Run pytest (full, under virtual X display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pytest -v

      # Coverage upload via the Codecov CLI directly — avoids the
      # `codecov-action` JS wrapper and its transitive `actions/github-script`
      # dependency, which still targets Node 20 even with
      # FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 (the env var forces it to RUN on
      # Node 24 but GitHub still annotates the manifest mismatch).
      # The CLI is a static binary; nothing JS, nothing transitive.
      # || true: a Codecov outage must not red the build.
      - name: Upload coverage to Codecov
        if: runner.os == 'Linux' && matrix.python-version == '3.12' && hashFiles('coverage.xml') != ''
        run: |
          curl -fsSL https://cli.codecov.io/latest/linux/codecov -o /tmp/codecov
          chmod +x /tmp/codecov
          /tmp/codecov upload-coverage \
            --file coverage.xml \
            --slug ThomasMayor/py-autoclick || true

  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff (format + lint)
        run: |
          ruff check pyautoclick tests
          ruff format --check pyautoclick tests

      - name: Mypy (strict, blocking)
        run: mypy pyautoclick
