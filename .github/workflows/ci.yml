name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Action versions are pinned to majors that ship Node 24 binaries — Node 20
# is being removed from GitHub runners on 2026-09-16. See:
# https://github.blog/changelog/2024-...-actions-deprecating-node20

jobs:
  test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10           # hard cap to prevent runner zombies
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install xvfb (Linux only — pynput xorg backend needs DISPLAY at import)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run pytest (skip linux_only on non-Linux)
        if: runner.os != 'Linux'
        run: pytest -v -m "not linux_only"

      - name: Run pytest (full, under virtual X display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pytest -v

      # Coverage upload: gate on Codecov being available rather than masking
      # the step's own failures. ``fail_ci_if_error: false`` lets a Codecov
      # outage pass quietly; we removed the ``continue-on-error: true`` that
      # was double-bypassing real workflow misconfigurations.
      - name: Upload coverage to Codecov
        if: runner.os == 'Linux' && matrix.python-version == '3.12' && hashFiles('coverage.xml') != ''
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff (format + lint)
        run: |
          ruff check pyautoclick tests
          ruff format --check pyautoclick tests

      - name: Mypy (strict, blocking)
        run: mypy pyautoclick
