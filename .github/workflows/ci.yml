name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10           # hard cap to prevent runner zombies
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install xvfb (Linux only — pynput xorg backend needs DISPLAY at import)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run pytest (skip linux_only on non-Linux)
        if: runner.os != 'Linux'
        run: pytest -v -m "not linux_only"

      - name: Run pytest (full, under virtual X display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pytest -v

      - name: Upload coverage to Codecov
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false   # Codecov outage should not red the build
        continue-on-error: true     # tolerate missing CODECOV_TOKEN on first runs

  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff (format + lint)
        run: |
          ruff check pyautoclick tests
          ruff format --check pyautoclick tests

      - name: Mypy (strict, blocking)
        run: mypy pyautoclick
